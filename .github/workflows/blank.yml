name: Windows Cross-Compile CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cross-compile:
    name: Build for Windows (${{ matrix.mgmt.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mgmt:
          - arch: "x86_64"
            host: "x86_64-w64-mingw32"

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    
    - name: Install Linux build tools and MinGW cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          make \
          mingw-w64 \
          libusb-1.0 >= 1.0.9

    - name: Fix MinGW Compiler Selection
      run: |
        # Explicitly select the posix-threading compiler backend to repair the 'compiler works... no' error
        sudo update-alternatives --set ${{ matrix.mgmt.host }}-gcc /usr/bin/${{ matrix.mgmt.host }}-gcc-posix
        sudo update-alternatives --set ${{ matrix.mgmt.host }}-g++ /usr/bin/${{ matrix.mgmt.host }}-g++-posix


    - name: Bootstrap build system using autogen.sh
      run: |
        if [ -f "./autogen.sh" ]; then
          chmod +x ./autogen.sh
          ./autogen.sh
        elif [ -f "./bootstrap" ]; then
          chmod +x ./bootstrap
          ./bootstrap
        else
          echo "Running autoreconf as fallback..."
          autoreconf -i --force
        fi


    - name: list working-dir
      run: |
        find .
        

    - name: Configure cross-compilation for Shared DLLs
      run: |
        # 1. Force enable shared and disable static
        # 2. Pass LDFLAGS="-no-undefined" to satisfy Windows PE linker requirements
        ./configure \
          --host=${{ matrix.mgmt.host }} \
          --prefix=$PWD/output \
          --enable-shared \
          --disable-static \
          LDFLAGS="-no-undefined"

    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: failed-x64-configure-dir-archive
        retention-days: 2
        path: ./
        
    - name: Compile project
      run: |
        #cd build
        # Utilizes all available CPU cores for faster parallel builds
        make -j$(nproc)

    - uses: actions/upload-artifact@v7
      if: ${{ failure() && 0 }}
      with:
        name: failed-x64-build-dir-archive
        retention-days: 2
        path: ./
        
    - name: Stage compiled binaries
      if: false
      run: |
        cd build
        make install

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-${{ matrix.mgmt.arch }}-run${{ github.run_number }}
        path: ./
        if-no-files-found: error
